name: Publish to GitHub Packages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: github-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish scoped npm package
    if: github.repository == 'NoName4Me/dsh-sidenotes' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.28.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@noname4me'
          cache: 'pnpm'
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify plugin
        run: |
          pnpm typecheck
          pnpm build
          pnpm test
          node scripts/check-manifest.mjs
      - name: Prepare GitHub Packages distribution
        run: |
          node scripts/prepare-github-package.mjs
          cd dist/github-package
          npm pack --dry-run --json --ignore-scripts
      - name: Determine npm dist-tag
        id: npm-tag
        working-directory: dist/github-package
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then
            # 0.1.0-dev.5 -> dev; 1.0.0-rc.1 -> rc
            TAG="${VERSION#*-}"
            TAG="${TAG%%.*}"
            if [[ ! "$TAG" =~ ^[a-z][a-z0-9-]*$ ]]; then
              echo "Invalid npm dist-tag derived from version: $VERSION" >&2
              exit 1
            fi
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION with npm dist-tag $TAG"
      - name: Publish to GitHub Packages
        working-directory: dist/github-package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --ignore-scripts --access restricted --tag "${{ steps.npm-tag.outputs.tag }}" --registry=https://npm.pkg.github.com
