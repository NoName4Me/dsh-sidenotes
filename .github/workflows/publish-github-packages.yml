name: Publish to GitHub Packages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: github-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish scoped npm package
    if: github.repository == 'NoName4Me/dsh-sidenotes' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.28.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@noname4me'
          cache: 'pnpm'
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify plugin
        run: |
          pnpm typecheck
          pnpm build
          pnpm test
          node scripts/check-manifest.mjs
      - name: Prepare GitHub Packages distribution
        run: |
          node scripts/prepare-github-package.mjs
          cd dist/github-package
          npm pack --dry-run --json --ignore-scripts
      - name: Publish to GitHub Packages
        working-directory: dist/github-package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --ignore-scripts --access restricted --registry=https://npm.pkg.github.com
