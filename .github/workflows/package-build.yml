name: Plugin build verification

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.28.5'
      - name: Install DSH 0.2.2 release candidate dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check Host and Client
        run: pnpm typecheck
      - name: Build plugin bundles
        run: pnpm build
      - name: Unit tests
        run: pnpm test
      - name: DSH adapter contract tests
        run: node --experimental-transform-types --test integration/*.test.ts
      - name: Package installable developer-preview tarball
        run: |
          mkdir -p dist
          pnpm pack --pack-destination dist
      - name: Verify public npm package without publishing
        run: |
          node scripts/check-manifest.mjs
          npm pack --dry-run --json --ignore-scripts > /tmp/sidechat-pack.json
          node -e "const f=require('/tmp/sidechat-pack.json')[0].files.map(x=>x.path);for(const x of ['lib/client.js','lib/index.mjs','cordis.patch.yml','dsh.plugin.json','icon.svg','locale/en.json','locale/zh.json','README.en.md'])if(!f.includes(x))throw Error('missing '+x)"
      - name: Publish CI installable artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-sidechat-developer-preview
          path: dist/*.tgz
          if-no-files-found: error
